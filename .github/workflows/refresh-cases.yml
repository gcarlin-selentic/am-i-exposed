name: Refresh case catalogue

# Semanal, lunes temprano en hora de Lima. La frecuencia la fija el ritmo de
# los ataques, no nuestra comodidad: entre dos ejecuciones se abren y se
# cierran plazos, y una pagina que dice "reclama hasta el 3 de octubre" el 10
# de octubre es peor que no tener la pagina.
#
# Por que aqui y no en un cron de Vercel: las paginas son estaticas y se
# generan de los datos del repositorio. Un cron de Vercel correria una funcion,
# que no puede escribir archivos del repositorio ni provocar el redespliegue
# sin un hook aparte. Esto descarga, regenera, confirma, y el push dispara el
# despliegue que Vercel ya hace con cada commit.

on:
  schedule:
    - cron: '0 9 * * 1'      # lunes 09:00 UTC = 04:00 en Lima
  workflow_dispatch:
    inputs:
      full:
        description: 'Volver a descargar todo el catalogo, no solo lo nuevo'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-cases
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # El catalogo completo son miles de paginas a un pedido por segundo. El
    # incremental termina en minutos; el techo es para que un --full no se
    # quede colgado toda la noche.
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Descargar lo nuevo de las fuentes
        run: python3 tools/refresh-cases.py ${{ inputs.full && '--full' || '' }}

      - name: Cruzar con Have I Been Pwned
        run: python3 tools/cross-hibp.py

      - name: Regenerar las paginas y el sitemap
        run: |
          python3 tools/build-settlement-pages.py
          python3 tools/build-sitemap.py

      # Una caida de la fuente puede devolver cero casos sin fallar el paso
      # anterior. Confirmar eso borraria el catalogo entero y se desplegaria
      # solo. Asi que se comprueba antes de confirmar nada.
      - name: Comprobar que el catalogo no se vacio
        run: |
          python3 - <<'PY'
          import json, sys
          paginas = json.load(open('data/settlement-pages.json'))
          casos = [p for p in paginas if p['tipo'] != 'indice']
          tarjeta = json.load(open('settlements.json'))
          print(f'casos {len(casos)}, filas en la tarjeta {len(tarjeta)}')
          if len(casos) < 800:
              sys.exit(f'solo {len(casos)} casos: la fuente fallo, no se confirma')
          if len(tarjeta) < 10:
              sys.exit(f'solo {len(tarjeta)} filas cruzadas: el cruce fallo, no se confirma')
          PY

      - name: Confirmar y empujar
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A data settlements.json settlements sitemap.xml
          if git diff --cached --quiet; then
            echo 'sin cambios esta semana'
            exit 0
          fi
          CASOS=$(python3 -c "import json;print(sum(1 for p in json.load(open('data/settlement-pages.json')) if p['tipo']!='indice'))")
          ABIERTOS=$(python3 -c "import json,datetime;h=datetime.date.today().isoformat();print(sum(1 for p in json.load(open('data/settlement-pages.json')) if p.get('plazo') and p['plazo']>=h))")
          git commit -m "Refresh case catalogue: ${CASOS} cases, ${ABIERTOS} still claimable" \
                     -m "Automated weekly run of tools/refresh-cases.py."
          git push
